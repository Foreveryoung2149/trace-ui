name: Verify Trace UI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: trace, POSTGRES_PASSWORD: trace, POSTGRES_DB: trace_ui_test}
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U trace" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TRACE_MODE: demo
      TRACE_STARTER_TEST_DATABASE_URL: postgresql://trace:trace@localhost:5432/trace_ui_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack --workspace @traceapi/timeline --dry-run
